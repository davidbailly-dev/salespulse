# Intégration continue : vérifie chaque pull request vers develop ou main, et chaque push sur
# ces branches (Render attend ce statut sur main pour déployer). Jalon 008, D2 à D5.
name: CI

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop, main]

permissions:
    contents: read

# Une exécution plus récente sur la même référence annule la précédente
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Nom exigé par la protection de develop et de main : ne pas le renommer sans la mettre à jour
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            # Serveur unique (jalon 011, D10) : il démarre sur le build, /health renvoie la version
            # du package.json racine, et SIGTERM l'arrête proprement (D9).
            - name: Démarrage du serveur
              run: |
                  npm run start:server > server.log 2>&1 &
                  server=$!
                  trap 'cat server.log' EXIT

                  for attempt in $(seq 1 30); do
                      body=$(curl -sf http://localhost:3000/health) && break
                      sleep 1
                  done
                  echo "/health : ${body:-sans réponse}"
                  expected=$(node -p "require('./package.json').version")
                  version=$(node -p 'JSON.parse(process.argv[1]).version' "${body:-null}")
                  test "$version" = "$expected"

                  kill -TERM "$server"
                  for attempt in $(seq 1 15); do
                      kill -0 "$server" 2>/dev/null || break
                      sleep 1
                  done
                  if kill -0 "$server" 2>/dev/null; then
                      echo "Le serveur ne s'est pas arrêté dans les 15 secondes"
                      exit 1
                  fi
                  wait "$server"
